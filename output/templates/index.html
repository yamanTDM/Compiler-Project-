{% extends "base.html" %}

{% block content %}
<h1>Products</h1>

{% if products %}
<div class="grid">
    {% for product in products %}
    <div class="card">
        <img src="{{ url_for('static', filename='uploads/' ~ product.image) }}">
        <h3>{{ product.name }}</h3>
        <p>€{{ product.price }}</p>

        <a href="{{ url_for('detail', id=product.id) }}">Details</a>

        <form action="{{ url_for('delete', id=product.id) }}" method="POST">
            <button type="submit" class="delete">Delete</button>
        </form>
    </div>
    {% endfor %}
</div>
{% else %}
<p>No products yet. <a href="{{ url_for('add') }}">Add one</a></p>
{% endif %}

{% endblock %}
