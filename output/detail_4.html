<html><head><title>Products App</title><link rel="stylesheet" href="/static/style.css"><style>
body {
  font-family: 'Segoe UI', sans-serif;
  margin: 0;
  background: #f4f6f9;
}
nav {
  background: #111827;
  padding: 15px;
  display: flex;
  gap: 15px;
}
nav a {
  color: white;
  text-decoration: none;
  font-weight: 500;
}
.container {
  padding: 30px;
}
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr 1fr 1fr 1fr;
  gap: 20px;
}
.card {
  background: white;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 4px 12px hsl(0, 0%, 44%);
  transition: 0.2s;
}
.card img {
  width: 100%;
  height: 300px;
  object-fit: cover;
}
.card h3 {
  margin: 10px;
}
.card p {
  margin: 0 10px 10px;
  color: #555;
}
.card a, .card button {
  display: inline-block;
  margin: 10px;
  padding: 8px 12px;
  border-radius: 6px;
  text-decoration: none;
  font-size: 14px;
}
.card a {
  background: #3b82f6;
  color: white;
}
.delete {
  background: #ef4444;
  color: white;
  border: none;
  cursor: pointer;
}
.form-container {
  max-width: 500px;
  margin: 0 auto;
  text-align: center;
}
.form-container input, .form-container textarea {
  width: 100%;
}
form input, form textarea {
  width: 100%;
  max-width: 400px;
  padding: 10px;
  margin: 10px 0;
  border-radius: 6px;
  border: 1px solid #ddd;
}
button {
  background: #10b981;
  color: white;
  border: none;
  padding: 10px 15px;
  border-radius: 6px;
  cursor: pointer;
}
.detail-img {
  width: 350px;
  border-radius: 10px;
  margin-bottom: 20px;
}
.detail-wrapper {
  display: flex;
  justify-content: center;
  margin-top: 40px;
}
.detail-card {
  display: flex;
  gap: 40px;
  background: white;
  padding: 30px;
  border-radius: 16px;
  box-shadow: 0 8px 25px hsl(0, 0%, 44%);
  max-width: 900px;
  width: 100%;
}
.detail-image img {
  width: 550px;
  height: 550px;
  object-fit: cover;
  border-radius: 12px;
}
.detail-info {
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.detail-info h1 {
  margin-bottom: 10px;
}
.price {
  font-size: 22px;
  font-weight: bold;
  color: #10b981;
  margin-bottom: 15px;
}
.description {
  color: #555;
  line-height: 1.5;
  margin-bottom: 20px;
  max-width: 400px;
}
.back-btn {
  display: inline-block;
  width: fit-content;
  background: #3b82f6;
  color: white;
  padding: 10px 15px;
  border-radius: 8px;
  text-decoration: none;
}
</style></head><body><nav><a href="/">Home</a><a href="/add">Add Product</a></nav><div class="container"><div class="detail-wrapper"><div class="detail-card"><div class="detail-image"><img src="/static/uploads/EXPS_TOHD24_167133_SarahTramonte_6.jpg"></div><div class="detail-info"><h1>pasta</h1><p class="price">€30000</p><p class="description"></p><a href="/" class="back-btn">← Back</a></div></div></div></div></body></html>
